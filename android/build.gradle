apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/ReactNativeMaps+autolinking.gradle'

android {
  namespace 'com.margelo.nitro.mapssession'
  compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

  if (rootProject.ext.has('ndkVersion')) ndkVersion rootProject.ext.ndkVersion

  defaultConfig {
    minSdk 24
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared'
        def abis = rootProject.findProperty('reactNativeArchitectures')
        if (abis) abiFilters(*abis.split(','))
      }
    }
  }

  buildFeatures { prefab true }
  externalNativeBuild { cmake { path 'CMakeLists.txt' } }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-nitro-modules')
  implementation 'com.google.android.gms:play-services-maps:19.1.0'
  testImplementation 'junit:junit:4.13.2'
}
